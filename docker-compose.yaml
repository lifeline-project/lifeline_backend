version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: lifeline_db
    environment:
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: neondb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: lifeline_backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://neondb_owner:password123@db:5432/neondb?sslmode=disable
      - JWT_SECRET=dev-secret-key-change-in-production-min-32-chars
      - DB_AUTO_MIGRATE=true
    depends_on:
      - db

volumes:
  postgres_data: