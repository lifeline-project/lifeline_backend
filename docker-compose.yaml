version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: lifeline_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lifeline_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: lifeline_backend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=${PORT:-8080}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/lifeline_db?sslmode=disable}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production-min-32-chars}
      - DB_AUTO_MIGRATE=${DB_AUTO_MIGRATE:-true}
    depends_on:
      - db

volumes:
  postgres_data: